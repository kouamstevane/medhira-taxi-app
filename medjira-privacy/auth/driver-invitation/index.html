<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f59e0b">
    <title>Ouvrir Medjira</title>
    <style>
      :root { color-scheme: dark; font-family: Arial, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #202124; color: #f8fafc; }
      main { width: min(92vw, 420px); box-sizing: border-box; padding: 32px 24px; text-align: center; }
      h1 { margin: 0 0 16px; font-size: 26px; }
      p { color: #cbd5e1; line-height: 1.5; }
      a { display: inline-block; margin-top: 18px; padding: 15px 24px; border-radius: 12px; background: #f59e0b; color: #111827; font-weight: 700; text-decoration: none; }
      .help { margin-top: 24px; font-size: 14px; }
      .error { color: #fca5a5; }
    </style>
  </head>
  <body>
    <main>
      <h1>Invitation chauffeur Medjira</h1>
      <p id="message">Ouverture de l’application Medjira…</p>
      <a id="open-app" href="#">Ouvrir l’application Medjira</a>
      <p class="help">Si l’application n’est pas encore installée, installez-la sur votre téléphone Android puis revenez sur ce lien.</p>
    </main>
    <script>
      (function () {
        var invitationId = new URLSearchParams(window.location.search).get('invitationId');
        var message = document.getElementById('message');
        var openApp = document.getElementById('open-app');

        if (!invitationId) {
          message.textContent = 'Cette invitation est incomplète ou expirée.';
          message.className = 'error';
          openApp.style.display = 'none';
          return;
        }

        var deepLink = 'medjira://auth/driver-invitation?invitationId=' + encodeURIComponent(invitationId);
        openApp.href = deepLink;
        window.setTimeout(function () { window.location.href = deepLink; }, 250);
      }());
    </script>
  </body>
</html>
